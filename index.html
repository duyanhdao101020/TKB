     {weeks:[[6,11]], teacher:"徐从辉", room:"17-135", time:"18:00–20:20 (tiết 10–12)"},
     {weeks:[[12,17]], teacher:"宣炳善", room:"17-135", time:"18:00–20:20 (tiết 10–12)"}
   ]},
  {day:2, name:"中国概况",
   segs:[{weeks:[[6,17]], teacher:"郑崧", room:"26-101", time:"18:00–20:20 (tiết 10–12)"}]},
  {day:5, name:"教育原理",
   segs:[
     {weeks:[[3,4],[6,7],[9,10],[12,13],[16,19]], teacher:"蔡群青", mode:"online", room:"Trực tuyến — zhihuishu.com (智慧树)", link:"https://www.zhihuishu.com", time:"09:40–11:15 (tiết 3–4)"},
     {weeks:[[5,5],[8,8],[11,11],[14,15]], teacher:"蔡群青", mode:"offline", room:"Trực tiếp — phòng 16-531", time:"09:40–11:15 (tiết 3–4)"}
   ]},
];

const DAY_NAMES = ["星期一","星期二","星期三","星期四","星期五","星期六","星期日"];

let currentWeek = weekOf(new Date());
if(currentWeek < 1) currentWeek = 1;
if(currentWeek > 19) currentWeek = 19;

function render(){
  const mon = mondayOfWeek(currentWeek);
  document.getElementById('wkLabel').textContent = "Tuần "+currentWeek;
  const sun = new Date(mon); sun.setDate(sun.getDate()+6);
  document.getElementById('dateRange').textContent = fmt(mon)+" – "+fmt(sun);

  const today = new Date();
  today.setHours(0,0,0,0);

  const container = document.getElementById('days');
  container.innerHTML = "";

  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const isToday = d.getTime() === today.getTime();
    const dayDiv = document.createElement('div');
    dayDiv.className = "day" + (isToday? " isToday":"");

    const head = document.createElement('div');
    head.className = "day-head";
    head.innerHTML = "<span>"+DAY_NAMES[i]+"</span><span>"+fmt(d)+(isToday? " · Hôm nay":"")+"</span>";
    dayDiv.appendChild(head);

    let any = false;
    COURSES.filter(c=>c.day===i).forEach(c=>{
      c.segs.forEach(seg=>{
        if(inRanges(currentWeek, seg.weeks)){
          any = true;
          const item = document.createElement('div');
          item.className = "classitem";
          const room = seg.room || c.room;
          const roomHtml = seg.link ? '<a href="'+seg.link+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">'+room+' ↗</a>' : room;
          const modeBadge = seg.mode === "online"
            ? '<span class="badge" style="background:var(--accent2);color:#2a1e08;">💻 ONLINE</span>'
            : (seg.mode === "offline" ? '<span class="badge" style="background:#4c7a4c;">🏫 TRỰC TIẾP</span>' : '');
          item.innerHTML =
            '<div class="cname">'+c.name+'</div>'+
            '<div class="cmeta">'+modeBadge+'<span class="badge">'+seg.time+'</span><br>'+roomHtml+' · '+seg.teacher+'</div>';
          dayDiv.appendChild(item);
        }
      });
    });
    if(!any){
      const empty = document.createElement('div');
      empty.className = "empty";
      empty.textContent = "Không có lớp";
      dayDiv.appendChild(empty);
    }
    container.appendChild(dayDiv);
  }
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentWeek>1){ currentWeek--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentWeek<19){ currentWeek++; render(); }
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentWeek = weekOf(new Date());
  if(currentWeek<1) currentWeek=1;
  if(currentWeek>19) currentWeek=19;
  render();
});

render();
</script>
</body>
</html>
