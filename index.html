<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thời khóa biểu — Kỳ 1 (2026-2027)</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#22252b; --muted:#6b7078;
  --accent:#3d5a80; --accent2:#e0a458; --line:#e6e3db; --today:#fff4de;
  --danger:#b3441e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --card:#1f2127; --ink:#eceef1; --muted:#9aa0a8;
    --accent:#7fa6d6; --accent2:#e0a458; --line:#31343b; --today:#3a2f1a;
    --danger:#ff8a5c;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --card:#1f2127; --ink:#eceef1; --muted:#9aa0a8;
  --accent:#7fa6d6; --accent2:#e0a458; --line:#31343b; --today:#3a2f1a;
  --danger:#ff8a5c;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.3rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:0.85rem;margin-bottom:16px;}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
}
.nav button{
  border:none;background:var(--accent);color:#fff;border-radius:10px;
  padding:10px 14px;font-size:1rem;cursor:pointer;
}
.nav button:active{opacity:0.8;}
.weeklabel{text-align:center;flex:1;}
.weeklabel .wk{font-weight:700;font-size:1.05rem;}
.weeklabel .dr{color:var(--muted);font-size:0.8rem;}
.todaybtn{
  display:block;margin:0 auto 16px;background:var(--accent2);color:#2a1e08;
  border:none;border-radius:10px;padding:8px 16px;font-size:0.85rem;cursor:pointer;
}
.day{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:12px;overflow:hidden;
}
.day.isToday{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset;}
.day-head{
  padding:10px 14px;font-weight:700;background:var(--today);
  display:flex;justify-content:space-between;font-size:0.9rem;
}
.day.isToday .day-head{background:var(--accent2);color:#2a1e08;}
.day:not(.isToday) .day-head{background:transparent;border-bottom:1px solid var(--line);}
.classitem{
  padding:10px 14px;border-bottom:1px solid var(--line);
}
.classitem:last-child{border-bottom:none;}
.cname{font-weight:600;font-size:0.95rem;}
.cmeta{color:var(--muted);font-size:0.8rem;margin-top:2px;line-height:1.5;}
.badge{
  display:inline-block;font-size:0.7rem;padding:1px 7px;border-radius:20px;
  background:var(--accent);color:#fff;margin-right:6px;
}
.empty{padding:16px 14px;color:var(--muted);font-size:0.85rem;text-align:center;}
.warn{
  background:var(--today);border:1px solid var(--accent2);border-radius:12px;
  padding:12px 14px;font-size:0.82rem;color:var(--ink);margin-bottom:16px;line-height:1.5;
}
.warn b{color:var(--danger);}
.overflow-x{overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 Thời khóa biểu — Học kỳ 1 (2026-2027)</h1>
  <div class="sub">国际中文教育（留学生）— khóa 2026 · Tuần 1 = 7/9/2026</div>


  <div class="nav">
    <button id="prevBtn" aria-label="Tuần trước">◀</button>
    <div class="weeklabel">
      <div class="wk" id="wkLabel">Tuần —</div>
      <div class="dr" id="dateRange">–</div>
    </div>
    <button id="nextBtn" aria-label="Tuần sau">▶</button>
  </div>
  <button class="todaybtn" id="todayBtn">Về tuần hiện tại</button>

  <div id="days"></div>
</div>

<script>
// Semester 1 starts Monday 2026-09-07 (Tuần 1)
const SEM_START = new Date(2026,8,7); // month is 0-indexed: 8 = Sept

function weekOf(date){
  const diffDays = Math.floor((date - SEM_START)/86400000);
  return Math.floor(diffDays/7)+1;
}
function mondayOfWeek(w){
  const d = new Date(SEM_START);
  d.setDate(d.getDate() + (w-1)*7);
  return d;
}
function fmt(d){
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
}
function inRanges(w, ranges){
  return ranges.some(r=> w>=r[0] && w<=r[1]);
}

// day: 0=Mon ... 6=Sun
const COURSES = [
  {day:1, name:"汉语要素教学", time:"08:00–12:00 (tiết 1–5)", room:"05-120",
   segs:[{weeks:[[6,8],[9,9]], teacher:"丁婵婵"}, {weeks:[[10,14]], teacher:"常新茹"}]},
  {day:3, name:"汉语要素教学", time:"14:45–17:10 (tiết 7–9)", room:"05-120 / 05-220",
   segs:[{weeks:[[6,9]], teacher:"林源", room:"05-220"}, {weeks:[[10,13]], teacher:"毛力群", room:"05-120"}]},
  {day:1, name:"微格教学 (3班)", time:"14:45–17:10 (tiết 7–9)", room:"16-311",
   segs:[{weeks:[[10,18]], teacher:"鲍蕊"}]},
  {day:0, name:"中华文化国际传播", time:"18:00–20:20 (tiết 10–12)", room:"17-135",
   segs:[{weeks:[[6,11]], teacher:"徐从辉"}, {weeks:[[12,17]], teacher:"宣炳善"}]},
  {day:1, name:"国际中文教育数智化", time:"10:35–12:00 (tiết 4–5)", room:"26-215",
   segs:[{weeks:[[6,17]], teacher:"赵润泽"}]},
  {day:2, name:"中国概况", time:"18:00–19:25 (tiết 10–11)", room:"26-101",
   segs:[{weeks:[[6,17]], teacher:"郑崧"}]},
  {day:5, name:"教育原理", time:"09:40–12:00 (tiết 3–5)", room:"",
   segs:[
     {weeks:[[3,4],[6,7],[9,10],[12,13],[16,19]], teacher:"蔡群青", mode:"online", room:"Trực tuyến — zhihuishu.com (智慧树)", link:"https://www.zhihuishu.com"},
     {weeks:[[5,5],[8,8],[11,11],[14,15]], teacher:"蔡群青", mode:"offline", room:"Trực tiếp — phòng 16-531"}
   ]},
];

const DAY_NAMES = ["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ Nhật"];

let currentWeek = weekOf(new Date());
if(currentWeek < 1) currentWeek = 1;
if(currentWeek > 19) currentWeek = 19;

function render(){
  const mon = mondayOfWeek(currentWeek);
  document.getElementById('wkLabel').textContent = "Tuần "+currentWeek;
  const sun = new Date(mon); sun.setDate(sun.getDate()+6);
  document.getElementById('dateRange').textContent = fmt(mon)+" – "+fmt(sun);

  const today = new Date();
  today.setHours(0,0,0,0);

  const container = document.getElementById('days');
  container.innerHTML = "";

  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const isToday = d.getTime() === today.getTime();
    const dayDiv = document.createElement('div');
    dayDiv.className = "day" + (isToday? " isToday":"");

    const head = document.createElement('div');
    head.className = "day-head";
    head.innerHTML = "<span>"+DAY_NAMES[i]+"</span><span>"+fmt(d)+(isToday? " · Hôm nay":"")+"</span>";
    dayDiv.appendChild(head);

    let any = false;
    COURSES.filter(c=>c.day===i).forEach(c=>{
      c.segs.forEach(seg=>{
        if(inRanges(currentWeek, seg.weeks)){
          any = true;
          const item = document.createElement('div');
          item.className = "classitem";
          const room = seg.room || c.room;
          const roomHtml = seg.link ? '<a href="'+seg.link+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">'+room+' ↗</a>' : room;
          const modeBadge = seg.mode === "online"
            ? '<span class="badge" style="background:var(--accent2);color:#2a1e08;">💻 ONLINE</span>'
            : (seg.mode === "offline" ? '<span class="badge" style="background:#4c7a4c;">🏫 TRỰC TIẾP</span>' : '');
          item.innerHTML =
            '<div class="cname">'+c.name+'</div>'+
            '<div class="cmeta">'+modeBadge+'<span class="badge">'+c.time+'</span><br>'+roomHtml+' · '+seg.teacher+'</div>';
          dayDiv.appendChild(item);
        }
      });
    });
    if(!any){
      const empty = document.createElement('div');
      empty.className = "empty";
      empty.textContent = "Không có lớp";
      dayDiv.appendChild(empty);
    }
    container.appendChild(dayDiv);
  }
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentWeek>1){ currentWeek--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentWeek<19){ currentWeek++; render(); }
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentWeek = weekOf(new Date());
  if(currentWeek<1) currentWeek=1;
  if(currentWeek>19) currentWeek=19;
  render();
});

render();
</script>
</body>
</html>
